# GRPO Post-Training Configuration for Alpamayo-R1
#
# Run with:
#   python -m alpamayo_r1.training.train_grpo --config-name grpo_default
#
# Override any value via CLI:
#   python -m alpamayo_r1.training.train_grpo training.num_train_epochs=1 data.max_samples=10

# Hydra logging — disable Hydra's extra handlers to prevent duplicate log lines
defaults:
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: none

# General
seed: 42
device: cuda
model_name: nvidia/Alpamayo-R1-10B

# LoRA configuration for VLM text attention layers
# Set lora.enabled=false for full-parameter training (requires FSDP for multi-GPU)
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

# GRPOConfig training parameters
training:
  output_dir: outputs/grpo
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 1e-5
  num_generations: 4        # G in GRPO (group size for advantage estimation)
  max_completion_length: 384  # CoC tokens (≤256) + 64 trajectory tokens + special tokens overhead
  gradient_checkpointing: true  # trade compute for memory
  beta: 0.0                  # no KL penalty -> no reference model needed
  loss_type: grpo
  logging_steps: 1
  save_steps: 100
  save_total_limit: 3
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  report_to: tensorboard

# Dataset
data:
  split: train
  t0_us: 5100000  # 5.1 seconds into each clip
  max_samples: 5000  # null = use all samples; set to int for debugging
  clip_ids_file: null  # optional path to parquet with clip_id column

# Rollout function parameters
rollout:
  temperature: 0.6
  top_p: 0.98
  max_generation_length: 256
  logprob_mini_batch_size: 2  # completions per VLM forward pass — reduced for 40GB GPU
  log_interval: 10       # steps between rollout text logging (CoC text + generated tokens)
  plot_interval: 50      # steps between BEV trajectory plots (null = same as log_interval)
  log_max_samples: 2     # max prompts to log per interval

# vLLM configuration for faster rollout generation
# Requires: pip install vllm
# Two modes:
#   colocate — vLLM engine runs in-process (default)
#   server   — vLLM runs as a separate process via `trl vllm-serve`
vllm:
  enabled: false
  mode: colocate              # "colocate" or "server"
  model_impl: transformers    # needed for Qwen3-VL support
  # --- Colocate-specific ---
  gpu_memory_utilization: 0.4 # fraction of GPU memory for vLLM KV cache + weights
  tensor_parallel_size: 1
  max_model_length: 8192      # must fit 16 images after vision token expansion (~5870 tokens)
  enable_sleep_mode: false    # offload weights between train/generate phases
  # --- Server-specific ---
  server_host: "0.0.0.0"
  server_port: 8000
  server_base_url: null       # overrides host+port if set
  server_timeout: 240.0
  group_port: 51216

# Reward function weights (must sum to 1.0)
rewards:
  trajectory_weight: 0.50
  reasoning_weight: 0.5
  consistency_weight: 0.0
