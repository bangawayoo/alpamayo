# GRPO Post-Training Configuration for Alpamayo-R1
#
# Run with:
#   python -m alpamayo_r1.training.train_grpo --config-name grpo_default
#
# Override any value via CLI:
#   python -m alpamayo_r1.training.train_grpo training.num_train_epochs=1 data.max_samples=10

# Hydra logging — disable Hydra's extra handlers to prevent duplicate log lines
defaults:
  - _self_
  - override hydra/hydra_logging: none
  - override hydra/job_logging: none

# General
seed: 42
device: cuda
model_name: nvidia/Alpamayo-R1-10B
base_model_name: nvidia/Alpamayo-R1-10B

# LoRA configuration for VLM text attention layers
# Set lora.enabled=false for full-parameter training (requires FSDP for multi-GPU)
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

# GRPOConfig training parameters
training:
  output_dir: outputs/grpo
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 1e-5
  num_generations: 8        # G in GRPO (group size for advantage estimation)
  max_completion_length: 384  # CoC tokens (≤256) + 64 trajectory tokens + special tokens overhead
  gradient_checkpointing: true  # trade compute for memory
  beta: 0.0                  # no KL penalty -> no reference model needed
  loss_type: grpo
  logging_steps: 1
  save_steps: 100
  save_total_limit: 3
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  report_to: tensorboard
  resume_from_checkpoint: null  # path to checkpoint dir to resume training, or null

# Dataset
data:
  split: train
  t0_us: 5100000  # 5.1 seconds into each clip
  max_samples: 3000  # null = use all samples; set to int for debugging
  clip_ids_file: null  # optional path to parquet with clip_id column
  exclude_clip_ids_file: notebooks/clip_ids.parquet  # exclude evaluation clips from training
  dataset_revision: 05e158af89ba  # HF dataset revision (pin to avoid breaking changes)

# Rollout function parameters
rollout:
  temperature: 0.6
  top_p: 0.98
  max_generation_length: 256
  num_traj_samples: 8    # trajectory samples per scene; must equal training.num_generations
  logprob_mini_batch_size: 2  # completions per VLM forward pass — reduced for 40GB GPU
  log_interval: 10       # steps between rollout text logging (CoC text + generated tokens)
  plot_interval: 50      # steps between BEV trajectory plots (null = same as log_interval)
  log_max_samples: 2     # max prompts to log per interval

# vLLM configuration for faster rollout generation
# Requires: pip install vllm
# Two modes:
#   colocate — vLLM engine runs in-process (default)
#   server   — vLLM runs as a separate process via `trl vllm-serve`
vllm:
  enabled: false
  mode: colocate              # "colocate" or "server"
  model_impl: transformers    # needed for Qwen3-VL support
  # --- Colocate-specific ---
  gpu_memory_utilization: 0.4 # fraction of GPU memory for vLLM KV cache + weights
  tensor_parallel_size: 1
  max_model_length: 8192      # must fit 16 images after vision token expansion (~5870 tokens)
  enable_sleep_mode: false    # offload weights between train/generate phases
  # --- Server-specific ---
  server_host: "0.0.0.0"
  server_port: 8000
  server_base_url: null       # overrides host+port if set
  server_timeout: 240.0
  group_port: 51216

# Early stopping on held-out validation set (uses eval clips from exclude_clip_ids_file)
early_stopping:
  enabled: true
  patience: 3              # stop after N evals with no improvement
  threshold: 0.01          # minimum improvement to count
  eval_steps: 100          # evaluate every N training steps
  eval_split: val          # dataset split filter (train 153k, val 91k, test 62k)
  eval_clip_ids_file: null # parquet with clip_id column; defaults to data.exclude_clip_ids_file
  eval_max_samples: 30     # clips in the validation set
  metric: reward  # overall weighted-sum reward across all reward functions

# Reward function weights (must sum to 1.0)
rewards:
  trajectory_weight: 0.50
  reasoning_weight: 0.5
  consistency_weight: 0.0

# Scene-level value head (learned GRPO baseline)
# When enabled, trains a small MLP to predict E[composite_reward | scene]
# online alongside GRPO. V1: auxiliary predictor only (no advantage replacement).
#
# Two-stage training:
#   Stage 0 (pretrain_steps > 0): only the value head trains; policy loss is
#     zero. Run for ~200-500 steps to bootstrap V(scene) before GRPO begins.
#   Stage 1 (online): value head continues training alongside GRPO.
#
# Workflow:
#   # Stage 0 — pre-train value head, save checkpoint
#   ./scripts/run_grpo.sh value_head.enabled=true \
#     value_head.pretrain_steps=300 value_head.save_path=outputs/value_head_pretrained.pt
#
#   # Stage 1 — full GRPO with warm-started value head
#   ./scripts/run_grpo.sh value_head.enabled=true \
#     value_head.load_path=outputs/value_head_pretrained.pt
value_head:
  enabled: false       # set true to enable
  hidden_dim: 4096     # must match VLM hidden size
  lr: 1e-4
  pretrain_steps: 0    # stage 0: steps where only value head trains (0 = skip stage 0)
  save_path: null      # save value head weights here after training (null = don't save)
  load_path: null      # load pre-trained value head weights at init (null = random init)
